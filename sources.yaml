# News sources — intentionally spread across sharply opposed geopolitical stances.
# `bias_tag` is a free-form label the cross-reference prompt uses to attribute
# narratives to camps.
#
# Working RSS sources as of 2026-04-22:
#   - RT, TASS, Sputnik: geo-blocked (connection refused); removed until proxy solution
#   - rsshub.app: unreliable public instance; replaced with direct feeds

sources:
  # ── Western mainstream ────────────────────────────────────────────────
  - name: "BBC World"
    bias_tag: "western-uk"
    lang: "en"
    rss: "http://feeds.bbci.co.uk/news/world/rss.xml"

  - name: "The Guardian World"
    bias_tag: "western-uk"
    lang: "en"
    rss: "https://www.theguardian.com/world/rss"

  - name: "NPR World"
    bias_tag: "western-wire"
    lang: "en"
    rss: "https://feeds.npr.org/1004/rss.xml"

  - name: "DW World"
    bias_tag: "western-wire"
    lang: "en"
    rss: "https://rss.dw.com/rdf/rss-en-world"

  # ── Middle-East / alternative narrative ──────────────────────────────
  - name: "Al Jazeera English"
    bias_tag: "middle-east"
    lang: "en"
    rss: "https://www.aljazeera.com/xml/rss/all.xml"

  - name: "Mehr News Agency"
    bias_tag: "middle-east"
    lang: "en"
    rss: "https://en.mehrnews.com/rss"

  - name: "PressTV"
    bias_tag: "middle-east"
    lang: "en"
    rss: "https://www.presstv.ir/rss.xml"

  # ── Chinese state / English international outlets (direct RSS) ────────
  - name: "CGTN World"
    bias_tag: "china-state"
    lang: "en"
    rss: "https://www.cgtn.com/subscribe/rss/section/world.xml"

  - name: "Global Times"
    bias_tag: "china-nationalist"
    lang: "en"
    rss: "https://www.globaltimes.cn/rss/outbrain.xml"

  - name: "China Daily"
    bias_tag: "china-state"
    lang: "en"
    rss: "http://www.chinadaily.com.cn/rss/world_rss.xml"

# News sources — intentionally spread across sharply opposed geopolitical stances.
# `bias_tag` is a free-form label the cross-reference prompt uses to attribute
# narratives to camps.
#
# Last verified: 2026-04-22 from Singapore
#   - RT, TASS, Sputnik (all variants): blocked/000 from Singapore
#   - WaPo RSS: dead (000)

sources:
  # ── UK / European mainstream ──────────────────────────────────────────
  - name: "BBC World"
    bias_tag: "western-uk"
    lang: "en"
    rss: "http://feeds.bbci.co.uk/news/world/rss.xml"

  - name: "The Guardian World"
    bias_tag: "western-uk"
    lang: "en"
    rss: "https://www.theguardian.com/world/rss"

  - name: "DW World"
    bias_tag: "western-wire"
    lang: "en"
    rss: "https://rss.dw.com/rdf/rss-en-world"

  # ── US mainstream (liberal-leaning) ──────────────────────────────────
  - name: "NPR World"
    bias_tag: "us-liberal"
    lang: "en"
    rss: "https://feeds.npr.org/1004/rss.xml"

  - name: "New York Times World"
    bias_tag: "us-liberal"
    lang: "en"
    rss: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"

  - name: "CNN World"
    bias_tag: "us-liberal"
    lang: "en"
    rss: "http://rss.cnn.com/rss/edition_world.rss"

  # ── US conservative ───────────────────────────────────────────────────
  - name: "Fox News World"
    bias_tag: "us-conservative"
    lang: "en"
    rss: "https://moxie.foxnews.com/google-publisher/world.xml"

  # ── Middle-East / alternative narrative ──────────────────────────────
  - name: "Al Jazeera English"
    bias_tag: "middle-east"
    lang: "en"
    rss: "https://www.aljazeera.com/xml/rss/all.xml"

  - name: "Mehr News Agency"
    bias_tag: "middle-east"
    lang: "en"
    rss: "https://en.mehrnews.com/rss"

  - name: "PressTV"
    bias_tag: "middle-east"
    lang: "en"
    rss: "https://www.presstv.ir/rss.xml"

  # ── Hong Kong / Chinese-adjacent perspective ─────────────────────────
  - name: "South China Morning Post"
    bias_tag: "china-hk"
    lang: "en"
    rss: "https://www.scmp.com/rss/91/feed"

  - name: "SCMP China"
    bias_tag: "china-hk"
    lang: "en"
    rss: "https://www.scmp.com/rss/4/feed"

  # ── Chinese state / English international outlets ─────────────────────
  - name: "CGTN World"
    bias_tag: "china-state"
    lang: "en"
    rss: "https://www.cgtn.com/subscribe/rss/section/world.xml"

  - name: "Global Times"
    bias_tag: "china-nationalist"
    lang: "en"
    rss: "https://www.globaltimes.cn/rss/outbrain.xml"

  - name: "China Daily"
    bias_tag: "china-state"
    lang: "en"
    rss: "http://www.chinadaily.com.cn/rss/world_rss.xml"

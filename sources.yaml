# News sources — intentionally spread across sharply opposed geopolitical stances.
# `bias_tag` is a free-form label the cross-reference prompt uses to attribute
# narratives to camps.
#
# Working RSS sources as of 2026-04-22:
#   - TASS, Sputnik, RT: geo-blocked; removed until proxy solution available
#   - RSSHub Chinese sources: public rsshub.app is unreliable; self-host if needed:
#       docker run -p 1200:1200 diygod/rsshub  → swap rsshub.app → localhost:1200

sources:
  # ── Western mainstream (all verified working) ─────────────────────────
  - name: "BBC World"
    bias_tag: "western-uk"
    lang: "en"
    rss: "http://feeds.bbci.co.uk/news/world/rss.xml"

  - name: "The Guardian World"
    bias_tag: "western-uk"
    lang: "en"
    rss: "https://www.theguardian.com/world/rss"

  - name: "NPR World"
    bias_tag: "western-wire"
    lang: "en"
    rss: "https://feeds.npr.org/1004/rss.xml"

  - name: "DW World"
    bias_tag: "western-wire"
    lang: "en"
    rss: "https://rss.dw.com/rdf/rss-en-world"

  # ── Middle-East / alternative narrative ──────────────────────────────
  - name: "Al Jazeera English"
    bias_tag: "middle-east"
    lang: "en"
    rss: "https://www.aljazeera.com/xml/rss/all.xml"

  # ── Chinese state / nationalist (requires working RSSHub) ────────────
  - name: "新华网 国际"
    bias_tag: "china-state"
    lang: "zh"
    rss: "https://rsshub.app/xinhuanet/world"

  - name: "观察者网 头条"
    bias_tag: "china-nationalist"
    lang: "zh"
    rss: "https://rsshub.app/guancha/headline"

  - name: "联合早报 国际"
    bias_tag: "overseas-chinese"
    lang: "zh"
    rss: "https://rsshub.app/zaobao/realtime/world"
